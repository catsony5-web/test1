name: Update IPO calendar

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-ipo-calendar.yml"
      - "scripts/ipo-calendar-lib.mjs"
      - "scripts/ipo-dart.mjs"
      - "scripts/ipo-official-supplements.mjs"
      - "scripts/update-ipo-calendar.mjs"
      - "tests/ipo-calendar-parser.test.mjs"
      - "tests/ipo-dart.test.mjs"
      - "tests/ipo-sources-view.test.cjs"
      - "tests/ipo-updater.test.mjs"
      - "tests/ipo-refresh.test.cjs"
  schedule:
    - cron: "0 23 * * *"
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-ipo-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify parser
        run: node --test tests/ipo-calendar-parser.test.mjs tests/ipo-dart.test.mjs tests/ipo-sources-view.test.cjs tests/ipo-updater.test.mjs tests/ipo-refresh.test.cjs
      - name: Fetch KRX KIND and DART schedules
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: node scripts/update-ipo-calendar.mjs
      - name: Commit changed public schedule only
        id: update
        shell: bash
        run: |
          if git diff --quiet -- data/ipo-calendar.json; then
            echo "No public schedule changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipo-calendar.json
          git commit -m "chore: update public IPO schedule"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
