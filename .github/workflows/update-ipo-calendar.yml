name: Update IPO calendar

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-ipo-calendar.yml"
      - "scripts/ipo-calendar-lib.mjs"
      - "scripts/update-ipo-calendar.mjs"
      - "tests/ipo-calendar-parser.test.mjs"
  schedule:
    - cron: "0 23 * * *"
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-ipo-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify parser
        run: node --test tests/ipo-calendar-parser.test.mjs
      - name: Fetch KRX KIND schedule
        run: node scripts/update-ipo-calendar.mjs
      - name: Commit changed public schedule only
        id: update
        shell: bash
        run: |
          if git diff --quiet -- data/ipo-calendar.json; then
            echo "No public schedule changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipo-calendar.json
          git commit -m "chore: update public IPO schedule"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish refreshed schedule to Pages
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPOSITORY/pages/builds"
